<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Universal Camera Emulation Engine</title>
    <style>
        :root {
            --bg-color: #121214;
            --card-bg: #1e1e24;
            --accent: #3b82f6;
            --accent-hover: #2563eb;
            --text-main: #f3f4f6;
            --text-muted: #9ca3af;
            --border: #374151;
            --highlight: #10b981;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 24px;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 900px;
        }

        header {
            margin-bottom: 24px;
            text-align: center;
        }

        header h1 {
            margin: 0 0 8px 0;
            font-size: 1.8rem;
            color: var(--text-main);
        }

        header p {
            margin: 0;
            color: var(--text-muted);
            font-size: 0.95rem;
        }

        .grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 24px;
        }

        @media (max-width: 640px) {
            .grid { grid-template-columns: 1fr; }
        }

        .card {
            background-color: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 20px;
        }

        .card h2 {
            margin-top: 0;
            font-size: 1.1rem;
            color: var(--accent);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 16px;
        }

        .form-group {
            margin-bottom: 16px;
        }

        .form-group:last-child {
            margin-bottom: 0;
        }

        label {
            display: block;
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-bottom: 6px;
            font-weight: 500;
        }

        select {
            width: 100%;
            padding: 10px 12px;
            background-color: #121214;
            border: 1px solid var(--border);
            border-radius: 6px;
            color: var(--text-main);
            font-size: 0.95rem;
            outline: none;
            transition: border-color 0.2s;
        }

        select:focus {
            border-color: var(--accent);
        }

        .output-card {
            background-color: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 20px;
        }

        .output-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border);
            padding-bottom: 12px;
            margin-bottom: 16px;
        }

        .output-header h3 {
            margin: 0;
            font-size: 1.2rem;
            color: var(--highlight);
        }

        .recipe-list {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 12px;
        }

        .recipe-item {
            background-color: #141418;
            padding: 10px 14px;
            border-radius: 6px;
            border-left: 3px solid var(--accent);
        }

        .recipe-item .title {
            font-size: 0.75rem;
            color: var(--text-muted);
            text-transform: uppercase;
        }

        .recipe-item .val {
            font-size: 0.95rem;
            font-weight: 600;
            color: var(--text-main);
            margin-top: 2px;
        }

        .badge {
            background-color: rgba(59, 130, 246, 0.2);
            color: var(--accent);
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 0.8rem;
            font-weight: 600;
        }

        .notes {
            margin-top: 16px;
            font-size: 0.85rem;
            color: var(--text-muted);
            font-style: italic;
        }

        .loading-status {
            text-align: center;
            padding: 20px;
            color: var(--text-muted);
            font-size: 0.9rem;
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>Camera Profile Emulation Engine</h1>
        <p>Translate target aesthetic looks into native camera settings</p>
    </header>

    <div class="grid">
        <!-- SOURCE CAMERA -->
        <div class="card">
            <h2>1. Camera You Own</h2>
            <div class="form-group">
                <label for="own-system">Sensor Format</label>
                <select id="own-system" onchange="onSystemChange()"></select>
            </div>
            <div class="form-group">
                <label for="own-brand">Brand</label>
                <select id="own-brand" onchange="onBrandChange()"></select>
            </div>
            <div class="form-group">
                <label for="own-camera">Camera Model</label>
                <select id="own-camera" onchange="calculateRecipe()"></select>
            </div>
        </div>

        <!-- TARGET LOOK -->
        <div class="card">
            <h2>2. Target Look to Mimic</h2>
            <div class="form-group">
                <label for="target-type">Target Category</label>
                <select id="target-type" onchange="updateTargetProfiles()">
                    <option value="all">All Targets</option>
                    <option value="film">Classic Film Stocks</option>
                    <option value="camera">Other Camera Profiles</option>
                </select>
            </div>
            <div class="form-group">
                <label for="target-profile">Target Profile / Look</label>
                <select id="target-profile" onchange="calculateRecipe()"></select>
            </div>
        </div>
    </div>

    <!-- OUTPUT RECIPE -->
    <div class="output-card">
        <div class="output-header">
            <h3 id="target-title-display">Recipe Settings</h3>
            <span class="badge" id="camera-badge-display">Camera Base</span>
        </div>
        <div class="recipe-list" id="recipe-container">
            <div class="loading-status">Loading camera database...</div>
        </div>
        <div class="notes" id="recipe-notes"></div>
    </div>
</div>

<script>
// Combined state loaded from JSON files
const DB = {
    systems: [],
    dataBySystem: {} // Maps Format -> Loaded JSON Object
};

// Files to fetch
const JSON_FILES = [
    'm43_cameras.json',
    'apsc_cameras.json',
    'ff_cameras.json'
];

// --- INITIALIZATION ---
window.addEventListener('DOMContentLoaded', async () => {
    await loadAllJSONFiles();
    initApp();
});

// Fetch all 3 JSON files concurrently using Promise.all
async function loadAllJSONFiles() {
    try {
        const responses = await Promise.all(JSON_FILES.map(file => fetch(file)));
        
        // Verify all fetched successfully
        for (let res of responses) {
            if (!res.ok) throw new Error(`HTTP error! Status: ${res.status} on ${res.url}`);
        }

        const jsonDatas = await Promise.all(responses.map(res => res.json()));

        // Populate DB state
        jsonDatas.forEach(data => {
            const systemName = data.system;
            DB.systems.push(systemName);
            DB.dataBySystem[systemName] = data;
        });

    } catch (error) {
        console.error("Error loading JSON files:", error);
        document.getElementById('recipe-container').innerHTML = `
            <div style="grid-column: 1/-1; color: #ef4444; text-align: center; padding: 20px;">
                <strong>Failed to load JSON database files.</strong><br>
                <small>Ensure <code>m43_cameras.json</code>, <code>apsc_cameras.json</code>, and <code>ff_cameras.json</code> are placed in the same folder as <code>index.html</code>.</small>
            </div>`;
    }
}

function initApp() {
    if (DB.systems.length === 0) return;

    // Populate systems dropdown
    initSelectOptions('own-system', DB.systems);
    onSystemChange();
}

function initSelectOptions(elemId, optionsArray) {
    const select = document.getElementById(elemId);
    select.innerHTML = '';
    optionsArray.forEach(opt => {
        const el = document.createElement('option');
        el.value = typeof opt === 'object' ? opt.id : opt;
        el.textContent = typeof opt === 'object' ? opt.name : opt;
        select.appendChild(el);
    });
}

function onSystemChange() {
    const system = document.getElementById('own-system').value;
    const systemData = DB.dataBySystem[system];
    
    if (!systemData) return;

    // Update Brands dropdown
    initSelectOptions('own-brand', systemData.brands);
    
    // Update Targets & Cameras
    onBrandChange();
    updateTargetProfiles();
}

function onBrandChange() {
    const system = document.getElementById('own-system').value;
    const brand = document.getElementById('own-brand').value;
    const cameraSelect = document.getElementById('own-camera');
    
    cameraSelect.innerHTML = '';
    const systemData = DB.dataBySystem[system];

    if (systemData && systemData.cameras[brand]) {
        systemData.cameras[brand].forEach(cam => {
            const el = document.createElement('option');
            el.value = cam;
            el.textContent = cam;
            cameraSelect.appendChild(el);
        });
    } else {
        const el = document.createElement('option');
        el.textContent = "No camera models found";
        cameraSelect.appendChild(el);
    }
    calculateRecipe();
}

function updateTargetProfiles() {
    const system = document.getElementById('own-system').value;
    const type = document.getElementById('target-type').value;
    const targetSelect = document.getElementById('target-profile');
    
    const systemData = DB.dataBySystem[system];
    if (!systemData || !systemData.targets) return;

    targetSelect.innerHTML = '';
    
    const filteredTargets = systemData.targets.filter(t => {
        if (type === 'all') return true;
        return t.category === type;
    });

    if (filteredTargets.length === 0) {
        const el = document.createElement('option');
        el.textContent = "No targets available for this category";
        targetSelect.appendChild(el);
    } else {
        filteredTargets.forEach(target => {
            const el = document.createElement('option');
            el.value = target.id;
            el.textContent = target.name;
            targetSelect.appendChild(el);
        });
    }

    calculateRecipe();
}

function calculateRecipe() {
    const system = document.getElementById('own-system').value;
    const brand = document.getElementById('own-brand').value;
    const targetId = document.getElementById('target-profile').value;
    
    const container = document.getElementById('recipe-container');
    const badge = document.getElementById('camera-badge-display');
    const title = document.getElementById('target-title-display');
    const notes = document.getElementById('recipe-notes');
    
    container.innerHTML = '';
    
    const systemData = DB.dataBySystem[system];
    if (!systemData) return;

    // Find Target Object
    const targetObj = systemData.targets ? systemData.targets.find(t => t.id === targetId) : null;
    title.textContent = targetObj ? targetObj.name : "Custom Recipe";

    // Lookup Rule
    const brandRules = systemData.emulationRules ? systemData.emulationRules[brand] : null;
    const rule = (brandRules && brandRules[targetId]) ? brandRules[targetId] : null;

    if (!rule) {
        badge.textContent = `${brand} Profile`;
        container.innerHTML = `
            <div style="grid-column: 1/-1; color: var(--text-muted); text-align: center; padding: 20px;">
                No stored recipe matrix for <strong>${brand}</strong> matching this target profile yet.
            </div>`;
        notes.textContent = "";
        return;
    }

    // Render Base
    badge.textContent = `Base: ${rule.base}`;

    // Render Settings
    for (const [key, val] of Object.entries(rule.settings)) {
        const div = document.createElement('div');
        div.className = 'recipe-item';
        div.innerHTML = `
            <div class="title">${key}</div>
            <div class="val">${val}</div>
        `;
        container.appendChild(div);
    }

    notes.textContent = rule.note ? `Note: ${rule.note}` : "";
}
</script>

</body>
</html>
