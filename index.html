<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Universal Camera Emulation Engine</title>
    <style>
        :root {
            --bg-color: #121214;
            --card-bg: #1e1e24;
            --accent: #3b82f6;
            --accent-hover: #2563eb;
            --text-main: #f3f4f6;
            --text-muted: #9ca3af;
            --border: #374151;
            --highlight: #10b981;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 24px 24px 0 24px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
        }

        .container {
            width: 100%;
            max-width: 960px;
            flex: 1;
        }

        header {
            margin-bottom: 24px;
            text-align: center;
        }

        header h1 {
            margin: 0 0 8px 0;
            font-size: 1.8rem;
            color: var(--text-main);
        }

        header p {
            margin: 0;
            color: var(--text-muted);
            font-size: 0.95rem;
        }

        .grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 24px;
        }

        @media (max-width: 640px) {
            .grid { grid-template-columns: 1fr; }
        }

        .card {
            background-color: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 20px;
        }

        .card h2 {
            margin-top: 0;
            font-size: 1.1rem;
            color: var(--accent);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 16px;
        }

        .form-group {
            margin-bottom: 16px;
        }

        .form-group:last-child {
            margin-bottom: 0;
        }

        label {
            display: block;
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-bottom: 6px;
            font-weight: 500;
        }

        select {
            width: 100%;
            padding: 10px 12px;
            background-color: #121214;
            border: 1px solid var(--border);
            border-radius: 6px;
            color: var(--text-main);
            font-size: 0.95rem;
            outline: none;
            transition: border-color 0.2s;
        }

        select:focus {
            border-color: var(--accent);
        }

        .output-card {
            background-color: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 24px;
        }

        .output-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border);
            padding-bottom: 12px;
            margin-bottom: 16px;
        }

        .output-header h3 {
            margin: 0;
            font-size: 1.2rem;
            color: var(--highlight);
        }

        .output-body {
            display: grid;
            grid-template-columns: 280px 1fr;
            gap: 20px;
        }

        @media (max-width: 768px) {
            .output-body { grid-template-columns: 1fr; }
        }

        .sample-preview {
            width: 100%;
            border-radius: 6px;
            overflow: hidden;
            border: 1px solid var(--border);
            background-color: #141418;
            display: flex;
            flex-direction: column;
        }

        .sample-preview img {
            width: 100%;
            height: 200px;
            object-fit: cover;
            display: block;
        }

        .sample-preview .caption {
            padding: 8px 12px;
            font-size: 0.75rem;
            color: var(--text-muted);
            text-align: center;
        }

        .recipe-list {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 12px;
        }

        .recipe-item {
            background-color: #141418;
            padding: 10px 14px;
            border-radius: 6px;
            border-left: 3px solid var(--accent);
        }

        .recipe-item .title {
            font-size: 0.75rem;
            color: var(--text-muted);
            text-transform: uppercase;
        }

        .recipe-item .val {
            font-size: 0.95rem;
            font-weight: 600;
            color: var(--text-main);
            margin-top: 2px;
        }

        .badge {
            background-color: rgba(59, 130, 246, 0.2);
            color: var(--accent);
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 0.8rem;
            font-weight: 600;
        }

        .notes {
            margin-top: 16px;
            font-size: 0.85rem;
            color: var(--text-muted);
            font-style: italic;
        }

        .loading-status {
            grid-column: 1 / -1;
            text-align: center;
            padding: 20px;
            color: var(--text-muted);
            font-size: 0.9rem;
        }

        /* Footer styling */
        footer {
            width: 100%;
            text-align: center;
            padding: 20px 0 24px 0;
            margin-top: auto;
            border-top: 1px solid var(--border);
            color: var(--text-muted);
            font-size: 0.9rem;
        }

        footer a {
            color: var(--accent);
            text-decoration: none;
            font-weight: 500;
            transition: color 0.2s;
        }

        footer a:hover {
            color: var(--accent-hover);
            text-decoration: underline;
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>Camera Profile Emulation Engine</h1>
        <p>Translate target aesthetic looks into native camera settings</p>
    </header>

    <div class="grid">
        <!-- SOURCE CAMERA -->
        <div class="card">
            <h2>1. Camera You Own</h2>
            <div class="form-group">
                <label for="own-system">Sensor Format</label>
                <select id="own-system" onchange="onSystemChange()"></select>
            </div>
            <div class="form-group">
                <label for="own-brand">Brand</label>
                <select id="own-brand" onchange="onBrandChange()"></select>
            </div>
            <div class="form-group">
                <label for="own-camera">Camera Model</label>
                <select id="own-camera" onchange="calculateRecipe()"></select>
            </div>
        </div>

        <!-- TARGET LOOK -->
        <div class="card">
            <h2>2. Target Look to Mimic</h2>
            <div class="form-group">
                <label for="target-type">Target Category</label>
                <select id="target-type" onchange="updateTargetProfiles()">
                    <option value="all">All Targets</option>
                    <option value="film">Classic Film Stocks</option>
                    <option value="camera">Other Camera Profiles</option>
                </select>
            </div>
            <div class="form-group">
                <label for="target-profile">Target Profile / Look</label>
                <select id="target-profile" onchange="calculateRecipe()"></select>
            </div>
        </div>
    </div>

    <!-- OUTPUT RECIPE -->
    <div class="output-card">
        <div class="output-header">
            <h3 id="target-title-display">Recipe Settings</h3>
            <span class="badge" id="camera-badge-display">Camera Base</span>
        </div>
        
        <div class="output-body">
            <!-- Sample Image Box -->
            <div class="sample-preview" id="sample-box" style="display: none;">
                <img id="sample-img" src="" alt="Target Sample">
                <div class="caption" id="sample-caption">Target Look Sample</div>
            </div>

            <!-- Recipe Settings List -->
            <div>
                <div class="recipe-list" id="recipe-container">
                    <div class="loading-status">Loading camera database...</div>
                </div>
                <div class="notes" id="recipe-notes"></div>
            </div>
        </div>
    </div>
</div>

<footer>
    Check out the project on <a href="https://github.com/suoko/pimpyourcamera" target="_blank" rel="noopener noreferrer">GitHub</a> — everybody is welcome to suggest or add anything!
</footer>

<script>
// Application State
const DB = {
    targets: [],           // Loaded from targets.json
    systems: [],           // List of available sensor systems
    dataBySystem: {}       // Maps Format -> Loaded JSON Object
};

const JSON_FILES = [
    { key: 'm43', url: 'm43_cameras.json' },
    { key: 'apsc', url: 'apsc_cameras.json' },
    { key: 'ff', url: 'ff_cameras.json' }
];

window.addEventListener('DOMContentLoaded', async () => {
    await loadAllJSONFiles();
    initApp();
});

async function loadAllJSONFiles() {
    try {
        // Fetch targets.json AND camera JSON files in parallel
        const targetsRes = await fetch('targets.json');
        if (!targetsRes.ok) throw new Error("Failed to load targets.json");
        const targetsData = await targetsRes.json();
        DB.targets = targetsData.targets || [];

        // Fetch camera system JSONs
        const cameraResponses = await Promise.all(
            JSON_FILES.map(item => fetch(item.url))
        );

        for (let res of cameraResponses) {
            if (!res.ok) throw new Error(`HTTP error! Status: ${res.status} on ${res.url}`);
        }

        const cameraJsons = await Promise.all(cameraResponses.map(res => res.json()));

        // Map system data by its 'system' attribute (e.g. "Micro Four Thirds", "APS-C", "Full Frame")
        cameraJsons.forEach(data => {
            const systemName = data.system;
            DB.systems.push(systemName);
            DB.dataBySystem[systemName] = data;
        });

    } catch (error) {
        console.error("Error loading database files:", error);
        document.getElementById('recipe-container').innerHTML = `
            <div style="grid-column: 1/-1; color: #ef4444; text-align: center; padding: 20px;">
                <strong>Failed to load JSON database files.</strong><br>
                <small>Ensure <code>targets.json</code>, <code>m43_cameras.json</code>, <code>apsc_cameras.json</code>, and <code>ff_cameras.json</code> are placed in the same directory.</small>
            </div>`;
    }
}

function initApp() {
    if (DB.systems.length === 0) return;

    // Populate systems dropdown
    initSelectOptions('own-system', DB.systems);
    onSystemChange();
}

function initSelectOptions(elemId, optionsArray) {
    const select = document.getElementById(elemId);
    select.innerHTML = '';
    optionsArray.forEach(opt => {
        const el = document.createElement('option');
        el.value = typeof opt === 'object' ? opt.id : opt;
        el.textContent = typeof opt === 'object' ? opt.name : opt;
        select.appendChild(el);
    });
}

function onSystemChange() {
    const system = document.getElementById('own-system').value;
    const systemData = DB.dataBySystem[system];
    
    if (!systemData) return;

    // Update Brands dropdown
    initSelectOptions('own-brand', systemData.brands);
    
    // Update Targets & Cameras
    onBrandChange();
    updateTargetProfiles();
}

function onBrandChange() {
    const system = document.getElementById('own-system').value;
    const brand = document.getElementById('own-brand').value;
    const cameraSelect = document.getElementById('own-camera');
    
    cameraSelect.innerHTML = '';
    const systemData = DB.dataBySystem[system];

    if (systemData && systemData.cameras && systemData.cameras[brand]) {
        systemData.cameras[brand].forEach(cam => {
            const el = document.createElement('option');
            el.value = cam;
            el.textContent = cam;
            cameraSelect.appendChild(el);
        });
    } else {
        const el = document.createElement('option');
        el.textContent = "No camera models found";
        cameraSelect.appendChild(el);
    }
    calculateRecipe();
}

function updateTargetProfiles() {
    const type = document.getElementById('target-type').value;
    const targetSelect = document.getElementById('target-profile');
    
    targetSelect.innerHTML = '';
    
    // Filter globally loaded DB.targets
    const filteredTargets = DB.targets.filter(t => {
        if (type === 'all') return true;
        return t.category === type;
    });

    if (filteredTargets.length === 0) {
        const el = document.createElement('option');
        el.textContent = "No targets available for this category";
        targetSelect.appendChild(el);
    } else {
        filteredTargets.forEach(target => {
            const el = document.createElement('option');
            el.value = target.id;
            el.textContent = target.name;
            targetSelect.appendChild(el);
        });
    }

    calculateRecipe();
}

function calculateRecipe() {
    const system = document.getElementById('own-system').value;
    const brand = document.getElementById('own-brand').value;
    const targetId = document.getElementById('target-profile').value;
    
    const container = document.getElementById('recipe-container');
    const badge = document.getElementById('camera-badge-display');
    const title = document.getElementById('target-title-display');
    const notes = document.getElementById('recipe-notes');
    
    // Sample Image UI Elements
    const sampleBox = document.getElementById('sample-box');
    const sampleImg = document.getElementById('sample-img');
    const sampleCaption = document.getElementById('sample-caption');

    container.innerHTML = '';
    
    // Find Target Object from DB.targets
    const targetObj = DB.targets.find(t => t.id === targetId);
    title.textContent = targetObj ? targetObj.name : "Custom Recipe";

    // Handle Sample Image display
    if (targetObj && targetObj.sampleImage) {
        sampleImg.src = targetObj.sampleImage.url;
        sampleImg.alt = targetObj.sampleImage.alt || targetObj.name;
        sampleCaption.textContent = targetObj.sampleImage.alt || "Target Sample Look";
        sampleBox.style.display = 'flex';
    } else {
        sampleBox.style.display = 'none';
    }

    // Lookup Emulation Rule from Camera Data
    const systemData = DB.dataBySystem[system];
    const brandRules = (systemData && systemData.emulationRules) ? systemData.emulationRules[brand] : null;
    const rule = (brandRules && brandRules[targetId]) ? brandRules[targetId] : null;

    if (!rule) {
        badge.textContent = `${brand} Profile`;
        container.innerHTML = `
            <div style="grid-column: 1/-1; color: var(--text-muted); text-align: center; padding: 20px;">
                No stored recipe matrix for <strong>${brand}</strong> matching this target profile yet.
            </div>`;
        notes.textContent = "";
        return;
    }

    // Render Base
    badge.textContent = `Base: ${rule.base}`;

    // Render Settings
    for (const [key, val] of Object.entries(rule.settings)) {
        const div = document.createElement('div');
        div.className = 'recipe-item';
        div.innerHTML = `
            <div class="title">${key}</div>
            <div class="val">${val}</div>
        `;
        container.appendChild(div);
    }

    notes.textContent = rule.note ? `Note: ${rule.note}` : "";
}
</script>

</body>
</html>
